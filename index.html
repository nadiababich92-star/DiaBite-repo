      <h1>DiaBite: can I eat this?</h1>
      <p>Describe a meal in your own words. DiaBite says whether it fits what is left of your day, and shows the arithmetic. A reference tool for adults in the US with type 2 diabetes, prediabetes or insulin resistance. It never gives a dose and is not medical advice. Every number is computed from a food database and checked, never generated by a language model. JavaScript is needed to use the app.</p>
