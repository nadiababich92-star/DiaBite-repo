# Build the engine image and push it to Azure Container Registry.
#
# The build runs here rather than in Azure because ACR Tasks (the cloud build
# behind `az containerapp up --source`) is not permitted on a Free Trial
# subscription. GitHub's runners are amd64, which is what Container Apps wants —
# building on an Apple Silicon laptop would mean emulation.
name: build-engine

on:
  push:
    branches: ['**']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'agent/**'
      # The image serves the browser app as well as the engine, so a change
      # to either rebuilds it. This used to be a careful list of the few
      # frontend files the engine shares; it is the whole app now.
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'data/recipes-db/ingredients.json'
      - 'data/recipes-db/recipes_db.json'
      - 'data/recipes-db/embeddings.bin'
      - 'data/recipes-db/embeddings.ids.json'
      - '.github/workflows/build-engine.yml'
  workflow_dispatch:

env:
  REGISTRY: ca83d2041d5eacr.azurecr.io
  REGISTRY_NAME: ca83d2041d5eacr
  IMAGE: diabite-engine

permissions:
  # Azure is entered with a short-lived token GitHub mints for this run, so
  # there is no registry password to store, rotate or leak.
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          # Vite inlines these at build time, so they have to be here rather
          # than in the container's environment. Both are publishable values —
          # the project URL and the anon key, which the browser would show
          # anyone who opened dev tools. Without them the app still works and
          # the feedback form is simply inert.
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the tag
        run: echo "pushed ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
